<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"> 
    <!-- Définit l'encodage en UTF-8 pour gérer les caractères spéciaux -->
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permet à la page d’être responsive sur mobile -->

    <title>Calcul age</title>
    <!-- Titre affiché dans l’onglet du navigateur -->

    <script src="calcul_age.js"></script>
    <!-- Lien vers ton fichier JavaScript externe -->

    <link rel="stylesheet" href="calcul_age.css">
    <!-- Lien vers ta feuille de style CSS -->
</head>

<body>
    <h2>Formulaire de calcul</h2>
    <!-- Titre de la page -->

    <br><br>
    
    <form>
        <!-- Formulaire regroupant l'ensemble des champs -->

        <div id="div1">
            <!-- Premier bloc contenant les champs Nom & Prénom -->

            <label for="nom">Nom:</label>
            <!-- Étiquette liée au champ "nom" -->

            <input type="text" id="nom" name="nom" value="">
            <!-- Champ texte dans lequel l’utilisateur écrit son nom -->

            <label for="prenom">Prénom:</label>
            <!-- Étiquette liée au champ "prenom" -->

            <input type="text" id="prenom" name="prenom" value="">
            <!-- Champ texte pour le prénom -->

            <br><br>
        </div>

        <div id="div2">
            <!-- Deuxième bloc : année de naissance + situation -->

            <label for="anneeDeNaissance">Année de naissance:</label>
            <!-- Étiquette du champ année -->

            <input type="number" id="aaaa" name="aaaa" value="">
            <!-- Champ numérique pour saisir l'année de naissance -->

            <label for="situation">Situation:</label>
            <!-- Titre indiquant que les options suivantes concernent la situation -->

            <input type="radio" id="etudiant" name="situation" value="Etudiant">
            <!-- Bouton radio : "Étudiant" -->

            <label for="etudiant">Etudiant</label>
            <!-- Label du bouton radio Étudiant -->

            <input type="radio" id="salarie" name="situation" value="Salarié">
            <!-- Bouton radio : "Salarié" -->

            <label for="salarie">Salarié</label>
            <!-- Label du bouton radio Salarié -->
        </div>

        <br><br>

        <div>
            <!-- Troisième bloc : affichage de l’âge -->

            <label for="age">Vous êtes âgé de :</label>
            <!-- Label associé au champ d'affichage de l’âge -->

            <input type="number" id="a" value="">
            <!-- Champ numérique où sera affiché ou calculé l’âge -->
        </div>

    </form>
</body>
</html>
