<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calcul âge</title>

        <!-- Lien vers JavaScript -->
        <script src="calcul_age.js"></script>

        <!-- Lien vers CSS -->
        <link rel="stylesheet" href="calcul_age.css">
    </head>

    <body>

        <!-- En-tête -->
        <header>
            <h2>Formulaire de calcul</h2>
        </header>

        <!-- Section principale-->
        <section>

            <form>

                <div id="div1">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom">

                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom">
                </div>

                <br>

                <div id="div2">
                    <label for="aaaa">Année de naissance :</label>
                    <input type="number" id="aaaa" name="aaaa">

                    <label>Situation :</label>

                    <input type="radio" id="etudiant" name="situation" value="Etudiant">
                    <label for="etudiant">Étudiant</label>

                    <input type="radio" id="salarie" name="situation" value="Salarié">
                    <label for="salarie">Salarié</label>
                </div>

                <br>

                <div>
                    <label for="a">Vous êtes âgé de :</label>
                    <input type="number" id="a" readonly>
                </div>

                <br>

                <div>
                    <input id="valider" type="submit" value="Valider">
                </div>

            </form>

        </section>

        <!-- pied de page -->
        <footer>
            <p> 2025 - Calcul dâge</p>
        </footer>

    </body>
</html>
