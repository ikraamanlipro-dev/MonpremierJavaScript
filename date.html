<html></html>
    <head>
        <meta charset="UTF-8">
        <title>Manipulation de Date</title>
        
        <script src="manipulationDate.js"></script>
        
        <link rel="stylesheet" href="date.css">
    
    </head>
    <body>
        <h1>Horloge</h1>

        <br><br>

        <p>Heure de mayotte</p>

            <br><br>

        <div class="date">

            

            <div id="dateAnnee">
                <span id="annee"></span>
            </div>
            
            <div id="dateMois">
                <span id="moisValue"></span>
            </div>
            
            <div id="dateJour">
                <span id="jourValue"></span>
            </div>    
        </div>

        <div class="time">
            <div id="timeHeure">
                <span id="heureValue"></span>
            </div>
            
            <div id="timeMinute">
                <span id="minuteValue"></span>
            </div>

            <div id="timeSeconde">
                <span id="secondeValue"></span>
            </div>  

        </div>

        <div class="paris">
            <p>Heure de Paris</p>

            <div class="date">
                <div id="dateAnneeParis"><span id="anneeParis"></span></div>
                <div id="dateMoisParis"><span id="moisParis"></span></div>
                <div id="dateJourParis"><span id="jourParis"></span></div>
            </div>

            <div class="time">
                <div id="timeHeureParis"><span id="heureParis"></span></div>
                <div id="timeMinuteParis"><span id="minuteParis"></span></div>
                <div id="timeSecondeParis"><span id="secondeParis"></span></div>
            </div>
        </div>

        <div class="tokyo">
            <p>Heure de Tokyo</p>

            <div class="date">
                <div id="dateAnneeTokyo"><span id="anneeTokyo"></span></div>
                <div id="dateMoisTokyo"><span id="moisTokyo"></span></div>
                <div id="dateJourTokyo"><span id="jourTokyo"></span></div>
            </div>

            <div class="time">
                <div id="timeHeureTokyo"><span id="heureTokyo"></span></div>
                <div id="timeMinuteTokyo"><span id="minuteTokyo"></span></div>
                <div id="timeSecondeTokyo"><span id="secondeTokyo"></span></div>
            </div>
        </div>
        
    </body>
</html>
